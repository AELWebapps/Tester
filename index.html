<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>相片紀錄產生器</title>

  <style>
    :root {
      color-scheme: light;

      font-family:
        Inter,
        "Segoe UI",
        "Microsoft JhengHei",
        "PingFang HK",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #263548;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;

      background:
        linear-gradient(
          145deg,
          #eef4fb,
          #ffffff
        );
    }

    button,
    input {
      font: inherit;
    }

    .app-shell {
      width: min(
        1100px,
        calc(100% - 32px)
      );

      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .page-header {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0;

      color: #1570a6;

      font-size: 0.78rem;
      font-weight: 800;

      letter-spacing: 0.08em;
    }

    h1,
    h2 {
      color: #102a43;
    }

    h1 {
      margin: 4px 0 12px;

      font-size:
        clamp(
          2rem,
          5vw,
          3.5rem
        );
    }

    h2 {
      margin: 2px 0 0;
    }

    .intro {
      max-width: 780px;
      margin-bottom: 0;

      color: #526b82;
      line-height: 1.6;
    }

    .panel {
      margin-top: 20px;
      padding: 24px;

      border: 1px solid #cad7e3;
      border-radius: 16px;

      background:
        rgba(
          255,
          255,
          255,
          0.94
        );

      box-shadow:
        0 14px 38px
        rgba(
          23,
          54,
          83,
          0.08
        );
    }

    label {
      display: grid;
      gap: 8px;

      font-weight: 700;
    }

    input[type="text"],
    input[type="date"],
    input[type="file"] {
      width: 100%;
      padding: 12px 14px;

      border: 1px solid #aebfd0;
      border-radius: 9px;

      background: #ffffff;
      color: #263548;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid
        rgba(
          21,
          112,
          166,
          0.25
        );

      outline-offset: 2px;
    }

    .field-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 18px;
      margin-top: 18px;
    }

    /*
     * 版面配置模式
     */

    .mode-panel {
      margin-top: 22px;
      padding: 16px;

      border: 1px solid #b7d7ea;
      border-radius: 12px;

      background: #eef8fd;
    }

    .mode-switch {
      display: flex;
      align-items: center;
      gap: 12px;

      cursor: pointer;
    }

    .mode-switch input {
      width: 22px;
      height: 22px;
      margin: 0;

      accent-color: #1570a6;
      cursor: pointer;
    }

    .mode-switch span {
      color: #102a43;
      font-weight: 800;
    }

    #modeDescription {
      margin: 8px 0 0 34px;

      color: #60758a;

      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.45;
    }

    /*
     * 相片拖放區
     */

    .drop-zone {
      display: grid;
      place-items: center;

      min-height: 180px;
      margin-top: 22px;
      padding: 24px;

      border: 2px dashed #1570a6;
      border-radius: 14px;

      background: #eef8fd;
      text-align: center;

      cursor: pointer;

      transition:
        background-color 150ms ease,
        border-color 150ms ease,
        transform 150ms ease;
    }

    .drop-zone:hover {
      background: #e1f3fc;
    }

    .drop-zone.dragging {
      border-color: #0c527d;
      background: #d1ecf9;

      transform:
        translateY(-2px);
    }

    .drop-zone strong {
      color: #102a43;
      font-size: 1.15rem;
    }

    .drop-zone span {
      color: #60758a;
      font-weight: 500;
    }

    .drop-zone input {
      max-width: 360px;
      margin-top: 8px;
    }

    /*
     * 相片預覽區
     */

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    #photoCount {
      display: inline-flex;
      align-items: center;

      min-height: 34px;
      padding: 6px 12px;

      border-radius: 999px;

      background: #e6f3fa;
      color: #0c527d;

      font-size: 0.9rem;
      font-weight: 800;
    }

    .preview-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(210px, 1fr)
        );

      gap: 16px;
      margin-top: 20px;
    }

    .photo-card {
      overflow: hidden;

      border: 1px solid #cad7e3;
      border-radius: 12px;

      background: #ffffff;

      box-shadow:
        0 8px 22px
        rgba(
          23,
          54,
          83,
          0.07
        );
    }

    .photo-card img {
      display: block;

      width: 100%;
      aspect-ratio: 4 / 3;

      object-fit: contain;

      background: #e8eef5;
    }

    .photo-body {
      padding: 12px;
    }

    .photo-body strong {
      display: block;
      color: #102a43;
    }

    .photo-body p {
      min-height: 34px;
      margin: 6px 0;

      color: #60758a;

      font-size: 0.85rem;
      line-height: 1.3;
    }

    .photo-body input {
      width: 100%;
      margin: 8px 0 10px;
      padding: 10px;

      border: 1px solid #aebfd0;
      border-radius: 8px;
    }

    .photo-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .empty-state {
      grid-column: 1 / -1;

      margin: 0;
      padding: 36px 20px;

      border: 1px dashed #cad7e3;
      border-radius: 12px;

      color: #60758a;
      text-align: center;
    }

    /*
     * 按鈕
     */

    button {
      border: 0;
      border-radius: 9px;

      padding: 12px 18px;

      background: #1570a6;
      color: #ffffff;

      font-weight: 800;
      cursor: pointer;

      transition:
        background-color 150ms ease,
        transform 150ms ease,
        opacity 150ms ease;
    }

    button:hover:not(:disabled) {
      background: #0f5e8e;

      transform:
        translateY(-1px);
    }

    button.secondary {
      background: #526b82;
    }

    button.secondary:hover:not(:disabled) {
      background: #40586d;
    }

    button.small {
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    button.danger {
      background: #a83232;
    }

    button.danger:hover:not(:disabled) {
      background: #872626;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;

      margin-top: 24px;
    }

    /*
     * 狀態訊息
     */

    .status {
      min-height: 26px;
      margin: 18px 0 0;

      font-weight: 700;
      line-height: 1.45;
    }

    /*
     * 模式說明
     */

    .information {
      margin-top: 28px;
      padding: 18px 20px;

      border-left: 4px solid #1570a6;
      border-radius: 8px;

      background: #edf7fc;
    }

    .information h2 {
      margin: 0 0 8px;

      font-size: 1.05rem;
    }

    .information ul {
      margin: 0;
      padding-left: 22px;

      color: #526b82;
      line-height: 1.6;
    }

    /*
     * 手機版面
     */

    @media (max-width: 680px) {
      .app-shell {
        width:
          min(
            100% - 20px,
            1100px
          );

        padding-top: 28px;
      }

      .panel {
        padding: 18px;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }

      #modeDescription {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="page-header">
      <p class="eyebrow">
        瀏覽器版 Word 報告產生器
      </p>

      <h1>
        相片紀錄產生器
      </h1>

      <p class="intro">
        選擇 Word 範本並上載相片。你可以調整相片次序、
        編輯相片說明、選擇版面配置模式，然後下載完成的
        Word 報告。
      </p>
    </header>

    <!-- 報告設定 -->
    <section
      class="panel"
      aria-labelledby="reportSettingsHeading"
    >
      <p class="eyebrow">
        步驟 1
      </p>

      <h2 id="reportSettingsHeading">
        報告設定
      </h2>

      <label>
        Word 範本

        <input
          id="templateInput"
          type="file"
          accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        >
      </label>

      <div class="field-grid">
        <label>
          服務日期

          <input
            id="serviceDate"
            type="date"
          >
        </label>

        <label>
          地點

          <input
            id="location"
            type="text"
            placeholder="例如：泵房 A"
            autocomplete="off"
          >
        </label>
      </div>

      <!-- 版面配置模式 -->
      <div class="mode-panel">
        <label class="mode-switch">
          <input
            id="fitOnePageMode"
            type="checkbox"
          >

          <span>
            將所有相片置於同一頁
          </span>
        </label>

        <p id="modeDescription">
          標準模式：每頁最多九張相片。
        </p>
      </div>
    </section>

    <!-- 上載相片 -->
    <section
      class="panel"
      aria-labelledby="photoUploadHeading"
    >
      <p class="eyebrow">
        步驟 2
      </p>

      <h2 id="photoUploadHeading">
        加入相片
      </h2>

      <label
        class="drop-zone"
        id="dropZone"
      >
        <strong>
          將相片拖放到此處
        </strong>

        <span>
          或選擇 JPG、JPEG 或 PNG 檔案
        </span>

        <input
          id="photoInput"
          type="file"
          accept="image/jpeg,image/png,.jpg,.jpeg,.png"
          multiple
        >
      </label>
    </section>

    <!-- 檢視相片 -->
    <section
      class="panel"
      aria-labelledby="photoReviewHeading"
    >
      <div class="section-heading">
        <div>
          <p class="eyebrow">
            步驟 3
          </p>

          <h2 id="photoReviewHeading">
            檢視已選相片
          </h2>
        </div>

        <span
          id="photoCount"
          aria-live="polite"
        >
          已選 0 張
        </span>
      </div>

      <div
        id="previewGrid"
        class="preview-grid"
      >
        <p class="empty-state">
          尚未選擇相片。
        </p>
      </div>
    </section>

    <!-- 操作按鈕 -->
    <section
      class="actions"
      aria-label="報告操作"
    >
      <button
        id="clearButton"
        class="secondary"
        type="button"
      >
        清除相片
      </button>

      <button
        id="generateButton"
        type="button"
      >
        產生 Word 報告
      </button>
    </section>

    <p
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></p>

    <!-- 版面配置說明 -->
    <aside class="information">
      <h2>
        版面配置模式
      </h2>

      <ul>
        <li>
          <strong>標準模式：</strong>
          每個相片頁最多放置九張相片。如有更多相片，
          新頁會重複顯示「支援相片」標題、服務日期及地點。
        </li>

        <li>
          <strong>將所有相片置於同一頁：</strong>
          應用程式會自動計算列數、欄數及相片尺寸，
          將全部已選相片放在同一個相片頁面內。
        </li>
      </ul>
    </aside>
  </main>

  <!-- JSZip 必須在 app.js 之前載入。 -->
  <script
    src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
  ></script>

  <script src="./app.js"></script>
</body>
</html>
