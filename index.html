<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Record Generator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #263548;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #eef4fb, #ffffff);
    }
    
    .app-shell {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }
    
    header { margin-bottom: 28px; }
    h1, h2 { color: #102a43; }
    h1 { margin: 4px 0 12px; font‐size: clamp(2rem, 5vw, 3.5rem); }
    h2 { margin: 2px 0 0; }
    
    .eyebrow {
      margin: 0;
      color: #1570a6;
      font‐size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    
    .panel {
      margin-top: 20px;
      padding: 24px;
      border: 1px solid #cad7e3;
      border‐radius: 16px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 14px 38px rgba(23, 54, 83, .08);
    }
    
    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }
    
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #aebfd0;
      border‐radius: 9px;
      font: inherit;
    }
    
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }
    
    .drop-zone {
      place-items: center;
      min-height: 170px;
      margin-top: 22px;
      border: 2px dashed #1570a6;
      border‐radius: 14px;
      background: #eef8fd;
      text-align: center;
      cursor: pointer;
    }
    
    .drop-zone.dragging { background: #d9f0fb; }
    .drop-zone input { max-width: 330px; }
    
    .section-heading,
    .actions,
    .photo-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    
    .photo-card {
      overflow: hidden;
      border: 1px solid #cad7e3;
      border‐radius: 12px;
      background: #fff;
    }
    
    .photo-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #e8eef5;
    }
    
    .photo-body { padding: 12px; }
    .photo-body input { margin: 8px 0 10px; }
    .empty-state { color: #60758a; }
    
    button {
      border: 0;
      border‐radius: 9px;
      padding: 12px 18px;
      background: #1570a6;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    
    button.secondary { background: #526b82; }
    button.small { padding: 8px 10px; font‐size: .85rem; }
    button.danger { background: #a83232; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    
    .actions { margin-top: 24px; justify-content: flex-end; }
    .status { min-height: 24px; font-weight: 700; }
    
    @media (max-width: 680px) {
      .field-grid { grid-template-columns: 1fr; }
      .actions { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">Browser-only prototype</p>
      <h1>Photo Record Generator</h1>
      <p>Select a Word template and several photos. The tool resizes the photos, creates two photos per row, and downloads a completed Word file.</p>
    </header>

    <section class="panel">
      <label>
        Word template
        <input id="templateInput" type="file" accept=".docx">
      </label>

      <div class="field-grid">
        <label>
          Service date
          <input id="serviceDate" type="date">
        </label>

        <label>
          Location
          <input id="location" type="text" placeholder="Pump Room A">
        </label>
      </div>

      <label class="drop-zone" id="dropZone">
        <strong>Drop photos here</strong>
        <span>or choose JPG / PNG files</span>
        <input id="photoInput" type="file" accept="image/jpeg,image/png" multiple>
      </label>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Selection basket</p>
          <h2>Photos</h2>
        </div>
        <span id="photoCount">0 selected</span>
      </div>

      <div id="previewGrid" class="preview-grid">
        <p class="empty-state">No photos selected yet.</p>
      </div>
    </section>

    <section class="actions">
      <button id="clearButton" class="secondary" type="button">Clear</button>
      <button id="generateButton" type="button">Generate Word report</button>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
